<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .gradient-word {
      fill: url(#accentGrad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 12s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    .floating-1 { animation: floatPill1 6s ease-in-out infinite; }
    .floating-2 { animation: floatPill2 5s ease-in-out infinite; }
    .glow-blob { animation: pulseGlow 7s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Technical Background Grid -->
  <g opacity="0.12">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748b" stroke-width="1" />
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" rx="16" />
  </g>

  <!-- Ambient Dynamic Glow Lights (Background Layer) -->
  <g class="glow-blob">
    <circle cx="200" cy="80" r="130" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1020" cy="270" r="140" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="600" cy="350" r="100" fill="#ec4899" filter="url(#glow)" opacity="0.3" />
  </g>

  <!-- Dynamic Connecting Node Flow in Background -->
  <g opacity="0.45">
    <path d="M 120 280 C 260 220, 380 320, 520 270 C 660 220, 800 310, 960 240 C 1040 200, 1100 240, 1140 220" 
          fill="none" stroke="url(#flowGrad)" stroke-width="2.5" class="flow-line" />
    <path d="M 80 100 C 240 160, 420 80, 600 130 C 780 180, 940 100, 1120 140" 
          fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" class="flow-line" style="animation-duration: 16s;" />
  </g>

  <!-- Interactive/Dynamic Decorative Cards & Pills (Sides/Corners) -->
  <!-- Top Left Pill -->
  <g class="floating-1" transform="translate(60, 45)">
    <rect width="150" height="34" rx="17" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1" filter="url(#cardShadow)" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" class="badge-text">⚡ Drag &amp; Drop</text>
  </g>

  <!-- Top Right Card/Pill -->
  <g class="floating-2" transform="translate(980, 45)">
    <rect width="160" height="34" rx="17" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1" filter="url(#cardShadow)" />
    <circle cx="20" cy="17" r="5" fill="#818cf8" />
    <text x="35" y="22" class="badge-text">🚀 Zero Boilerplate</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-2" transform="translate(70, 290)">
    <rect width="165" height="34" rx="17" fill="url(#cardGrad1)" stroke="#34d399" stroke-width="1" filter="url(#cardShadow)" />
    <circle cx="20" cy="17" r="5" fill="#34d399" />
    <text x="35" y="22" class="badge-text">🔓 Open-Source First</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-1" transform="translate(965, 290)">
    <rect width="175" height="34" rx="17" fill="url(#cardGrad1)" stroke="#f472b6" stroke-width="1" filter="url(#cardShadow)" />
    <circle cx="20" cy="17" r="5" fill="#f472b6" />
    <text x="35" y="22" class="badge-text">🏢 Enterprise Scalable</text>
  </g>

  <!-- Center Decorative Studio Canvas Frame (Subtle Studio UI aesthetic) -->
  <g opacity="0.35">
    <rect x="250" y="24" width="700" height="4" rx="2" fill="url(#accentGrad)" />
    <circle cx="265" cy="40" r="4" fill="#ef4444" />
    <circle cx="280" cy="40" r="4" fill="#eab308" />
    <circle cx="295" cy="40" r="4" fill="#22c55e" />
  </g>

  <!-- FOREGROUND: Main Title and Subtitles (High Contrast & Clear Visibility) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(485, 68)">
      <rect width="230" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="115" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" class="title-text">
      Visual App Design &amp; <tspan class="gradient-word">Low-Code Studio</tspan>
    </text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="194" text-anchor="middle" class="subtitle-text">
      A curated index of top Visual Builders, Drag-and-Drop Studios, SaaS &amp; Open-Source Platforms
    </text>

    <!-- Subtitle Line 2 (Key capabilities pills) -->
    <text x="600" y="226" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      Internal Tools • Admin Panels • Full-Stack Web &amp; Mobile Apps • Database Backends • Workflows
    </text>

    <!-- Dynamic Metric Badges in Center Foreground -->
    <g transform="translate(370, 252)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">✨ 15+ OSS Suites</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(160, 0)">
        <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🏢 9+ SaaS Leaders</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(320, 0)">
        <rect width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="70" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⭐ Live Star Ranks</text>
      </g>
    </g>
  </g>
</svg>
